name: Build desktop apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Install frontend dependencies
        run: npm install
      - name: Build universal macOS app
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
      - name: Verify both executable architectures
        run: |
          set -euo pipefail
          BINARY="src-tauri/target/universal-apple-darwin/release/freetune-desktop"
          if [ ! -f "$BINARY" ]; then
            echo "Universal executable not found. Build output:"
            find src-tauri/target -type f -name freetune-desktop -print
            exit 1
          fi
          file "$BINARY"
          lipo "$BINARY" -info
          lipo "$BINARY" -verify_arch x86_64 arm64
      - uses: actions/upload-artifact@v4
        with:
          name: FreeTune-macOS-Universal
          if-no-files-found: error
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: FreeTune-Windows-x64
          if-no-files-found: error
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
